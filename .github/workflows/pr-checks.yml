# Secret scan of the PR's own commits on every pull request (the GitLab
# gitleaks-validate MR job): maestra-io/github-actions pr-checks.yml, gitleaks only.
# maestra-io/issues-maestra#1568
name: pr-checks

on: pull_request

jobs:
  checks:
    uses: maestra-io/github-actions/.github/workflows/pr-checks.yml@main
    permissions:
      contents: read
    with:
      check-encoding: false
      kustomize: false
