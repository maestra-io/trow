name: Tests

on:
  pull_request:
    branches:
      - main


jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: j178/prek-action@e98a699c41eb69ab013a45817a0406469a748f8d # v2.0.5

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # nora OIDC token: the Rust toolchain via packages.maestra.io
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Rust 1.99.1 from nora raw (packages.maestra.io, issues-maestra#1649), not rustup from
      # static.rust-lang.org: the tarballs of maestra-io/dockerfiles .github/raw-uploads/rust.txt
      # (sha256 = the release's channel manifest hash), installed with their own install.sh,
      # ahead of the runner's rustup on PATH. A bump needs new rust.txt lines and these pins.
      - name: nora token for the Rust toolchain
        id: nora-rust
        uses: maestra-io/github-actions/nora-session@b23cf64c53b689f5ae98b08bac884cf1ffc1b3c1 # v1.78.1
      - name: Rust toolchain from nora
        env:
          NORA_TOKEN: ${{ steps.nora-rust.outputs.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/rust"; dl="$RUNNER_TEMP/rust-dl"; mkdir -p "$dir" "$dl"
          while read -r sum c; do
            f="$dl/$c.tar.gz"
            # the token reaches curl as a config on stdin, never in argv
            printf 'user = "token:%s"\n' "$NORA_TOKEN" | curl -fsS --retry 3 -K - -o "$f" \
              "https://packages.maestra.io/raw/src/static.rust-lang.org/dist/2026-10-15/$c-1.99.1-x86_64-unknown-linux-gnu.tar.gz"
            echo "$sum  $f" | sha256sum -c -
            mkdir "$dl/$c" && tar xzf "$f" -C "$dl/$c" --strip-components=1
            "$dl/$c/install.sh" --prefix="$dir" --disable-ldconfig > /dev/null
          done <<'PINS'
          85e7c0e6f21636f714e2a42966011364a6cc56b6548126d32144d6ba90904966 rustc
          47babc028247e26577f8a1bf390b11f447ad9b7ab93f5c9a0dda078935fc149b cargo
          d1290c05994a59c029e562cb75be1bddc6fb11a4c501e1b7b0f61d119c6cbb12 rust-std
          3c6d008544b6e456cc785c86f8ce3713f0d845b94be3a6c8a34662b8504561b5 clippy
          e3a88008061f485126fe24569c4d3e5a0f49462a06ee6339920f8f202124b13a rustfmt
          PINS
          rm -rf "$dl"
          # cargo runs subcommands (cargo-clippy, cargo-fmt) from $CARGO_HOME/bin first, where a
          # runner's rustup proxies sit: they get this toolchain as rustup's default, so none downloads.
          if command -v rustup > /dev/null; then rustup toolchain link nora-1.99.1 "$dir" && rustup default nora-1.99.1; fi
          echo "$dir/bin" >> "$GITHUB_PATH"
          export PATH="$dir/bin:$PATH"
          rustc -vV | grep -qx 'release: 1.99.1' && cargo -V && cargo clippy -V && cargo fmt --version
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # 0.9.0
      - name: Cache compilation artefacts
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: nextest,sqlx-cli
      - name: Setup sqlx database
        run: mkdir -p target && cargo sqlx database setup
      - name: Check .sqlx folder
        run: cargo sqlx prepare --check
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Run Trow test suite
        run: RUST_LOG=info cargo nextest run -- --skip ipv6


  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # nora OIDC token: base image and apt via packages.maestra.io
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    outputs:
      container-image: ${{ steps.meta.outputs.tags }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Rust 1.99.1 from nora raw (packages.maestra.io, issues-maestra#1649), not rustup from
      # static.rust-lang.org: the tarballs of maestra-io/dockerfiles .github/raw-uploads/rust.txt
      # (sha256 = the release's channel manifest hash), installed with their own install.sh,
      # ahead of the runner's rustup on PATH. A bump needs new rust.txt lines and these pins.
      - name: nora token for the Rust toolchain
        id: nora-rust
        uses: maestra-io/github-actions/nora-session@b23cf64c53b689f5ae98b08bac884cf1ffc1b3c1 # v1.78.1
      - name: Rust toolchain from nora
        env:
          NORA_TOKEN: ${{ steps.nora-rust.outputs.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/rust"; dl="$RUNNER_TEMP/rust-dl"; mkdir -p "$dir" "$dl"
          while read -r sum c; do
            f="$dl/$c.tar.gz"
            # the token reaches curl as a config on stdin, never in argv
            printf 'user = "token:%s"\n' "$NORA_TOKEN" | curl -fsS --retry 3 -K - -o "$f" \
              "https://packages.maestra.io/raw/src/static.rust-lang.org/dist/2026-10-15/$c-1.99.1-x86_64-unknown-linux-gnu.tar.gz"
            echo "$sum  $f" | sha256sum -c -
            mkdir "$dl/$c" && tar xzf "$f" -C "$dl/$c" --strip-components=1
            "$dl/$c/install.sh" --prefix="$dir" --disable-ldconfig > /dev/null
          done <<'PINS'
          85e7c0e6f21636f714e2a42966011364a6cc56b6548126d32144d6ba90904966 rustc
          47babc028247e26577f8a1bf390b11f447ad9b7ab93f5c9a0dda078935fc149b cargo
          d1290c05994a59c029e562cb75be1bddc6fb11a4c501e1b7b0f61d119c6cbb12 rust-std
          3c6d008544b6e456cc785c86f8ce3713f0d845b94be3a6c8a34662b8504561b5 clippy
          e3a88008061f485126fe24569c4d3e5a0f49462a06ee6339920f8f202124b13a rustfmt
          PINS
          rm -rf "$dl"
          # cargo runs subcommands (cargo-clippy, cargo-fmt) from $CARGO_HOME/bin first, where a
          # runner's rustup proxies sit: they get this toolchain as rustup's default, so none downloads.
          if command -v rustup > /dev/null; then rustup toolchain link nora-1.99.1 "$dir" && rustup default nora-1.99.1; fi
          echo "$dir/bin" >> "$GITHUB_PATH"
          export PATH="$dir/bin:$PATH"
          rustc -vV | grep -qx 'release: 1.99.1' && cargo -V && cargo clippy -V && cargo fmt --version
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # 0.9.0
      - name: Cache compilation artefacts
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: sqlx-cli
      - name: Setup sqlx database
        run: mkdir -p target && cargo sqlx database setup
      - name: Build
        run: |
          cargo build
          mv target/debug/trow trow
      # BuildKit pulls the base images through nora (packages.maestra.io, issues-maestra#1649)
      # with ~/.docker/config.json. nora takes the GitHub OIDC token, which lives minutes: a
      # credential helper mints a fresh one per pull. Same step as dotnet-service-build.yml in
      # maestra-io/github-actions.
      - name: nora docker credentials
        env:
          AUDIENCE: packages.maestra.io
          PACKAGES_URL: https://packages.maestra.io
        run: |
          # >>> nora-cred-helper (copy of maestra-io/github-actions dotnet-service-build.yml)
          bin="$RUNNER_TEMP/nora-bin"; mkdir -p "$bin"
          # The helper runs in the caller's environment, which tox and other test runners
          # scrub: the job's OIDC request URL and token go to a 0600 file next to it.
          ( umask 077; printf 'url=%q\ntoken=%q\naud=%q\n' "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$AUDIENCE" > "$bin/oidc.env" )
          cat > "$bin/docker-credential-nora" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          [ "${1:-}" = get ] || exit 0
          server=$(cat) # docker sends it without a newline
          . "${BASH_SOURCE[0]%/*}/oidc.env"
          t=$(curl -sSf --retry 3 --connect-timeout 10 --max-time 30 -H "Authorization: bearer $token" \
            "$url&audience=$aud" | jq -r '.value // empty')
          [ -n "$t" ]
          jq -cn --arg s "$server" --arg t "$t" '{ServerURL: $s, Username: "token", Secret: $t}'
          EOF
          chmod 755 "$bin/docker-credential-nora"
          echo "$bin" >> "$GITHUB_PATH"
          host="${PACKAGES_URL#*://}"; host="${host%%/*}"
          cfg="${DOCKER_CONFIG:-$HOME/.docker}/config.json"; mkdir -p "$(dirname "$cfg")"
          [ -s "$cfg" ] || echo '{}' > "$cfg"
          jq --arg h "$host" '.credHelpers[$h] = "nora"' "$cfg" > "$cfg.t" && mv "$cfg.t" "$cfg"
          # <<< nora-cred-helper

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      # Fresh nora token (minutes-lived) right before the image build, for apt in
      # Dockerfile.debug (issues-maestra#1649).
      - name: nora token for the image build
        id: nora-image
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const t = await core.getIDToken('packages.maestra.io');
            core.setSecret(t);
            core.setOutput('token', t);
      - name: Build and export container image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./docker/Dockerfile.debug
          tags: trow:onpr
          secrets: PRIVATE_PACKAGES_TOKEN=${{ steps.nora-image.outputs.token }}
          outputs: type=docker,dest=/tmp/trow_image.tar.zst
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 3
          name: "trow-image-${{ github.event.pull_request.number }}"
          path: /tmp/trow_image.tar.zst


  oci-conformance:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Download container image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "trow-image-${{ github.event.pull_request.number }}"
          path: /tmp
      - name: Load and run image
        id: start-container-image
        run: |
          docker load --input /tmp/trow_image.tar.zst
          ID=$(docker run -d -e RUST_LOG=debug --name trow -p 8000:8000 trow:onpr --bind 0.0.0.0:8000)
          IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $ID)
          echo "container-ip=$IP" >> $GITHUB_OUTPUT
          echo "ID=$ID   IP=$IP"
          docker logs $ID
      - name: Test connectivity
        run: curl "http://${{ steps.start-container-image.outputs.container-ip }}:8000"
      - name: Run OCI Distribution Spec conformance tests
        uses: opencontainers/distribution-spec@a139cc423184af6078077b9b7ee336eddbd03f8f # v1.1.1
        env:
          OCI_ROOT_URL: "http://${{ steps.start-container-image.outputs.container-ip }}:8000"
          OCI_NAMESPACE: oci-conformance/distribution-test
          OCI_TEST_PULL: 1
          OCI_TEST_PUSH: 1
          OCI_TEST_CONTENT_DISCOVERY: 1
          OCI_TEST_CONTENT_MANAGEMENT: 1
          OCI_HIDE_SKIPPED_WORKFLOWS: 0
          OCI_DEBUG: 0
      - name: Print trow logs
        if: always()
        run: docker logs trow


  helm-chart-validation:
    runs-on: ubuntu-latest
    needs: build
    env:
      IMAGE: ${{ needs.build.outputs.container-image }}
    timeout-minutes: 10
    steps:
      - name: Download container image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "trow-image-${{ github.event.pull_request.number }}"
          path: /tmp
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          config: .github/workflows/config/kind.yaml
          cluster_name: kind
      - name: Get kind node IP
        id: get-ip
        run: |
          IP=$(kubectl get nodes -o jsonpath='{.items[*].status.addresses[?(@.type=="InternalIP")].address}')
          echo "ip=$IP" >> $GITHUB_OUTPUT
      - name: Sideload Trow image
        run: |
          kind load image-archive /tmp/trow_image.tar.zst
      - name: Helm Install Trow
        run: |
          helm install trow-test -f .github/workflows/config/values.yaml charts/trow/
      - name: Wait for trow
        run: |
          kubectl wait --for condition=ready pod/trow-test-0 --timeout=300s
      - name: Pull proxied image from trow
        run: podman pull --tls-verify=false ${{ steps.get-ip.outputs.ip }}:30000/f/docker.io/nginx:alpine
      - if: always()
        name: Export pod logs
        run: kind export logs kind-logs
      - if: always()
        name: Upload pod logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pod-logs-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: kind-logs/
          retention-days: 30
          compression-level: 7
