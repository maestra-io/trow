name: Build and Push to ECR

# Maestra fork build: publishes our patched trow (streaming pull-through,
# see src/services/proxy_service/stream_cache.rs) to our private ECR.
# Upstream's own workflows (pr-tests / push / tag-trow) are left untouched so
# `upstream/main` keeps merging cleanly.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
      - 'charts/**'
      - 'docs/**'
  pull_request:
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - docker/**
      - .github/workflows/build-and-push-ecr.yml
  workflow_dispatch:

# Serialize builds against main so two concurrent merges don't race the
# release-number action + duplicate-tag the same digest.
# The group name carries a generation suffix: a run that wedges in `queued`
# with zero jobs (GitHub-side, observed 2026-08-26 — the API reported both
# `queued` and "cannot cancel, already completed") holds the group forever
# and starves every later run. Bumping the suffix frees the queue without
# giving up serialization.
concurrency:
  group: build-and-push-ecr-g2
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  ECR_REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com
  AWS_REGION: us-west-2
  TELEPORT_FQDN: teleport.maestra.io:443
  TELEPORT_TOKEN: image-push-github-actions-trow
  AWS_ROLE_ARN: "arn:aws:iam::515260921971:role/teleport-image-push"
  IMAGE_NAME: trow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # No git operations downstream — don't leave a `GITHUB_TOKEN`
          # in `.git/config` for the rest of the job to find.
          persist-credentials: false

      - name: Get Teleport version
        id: tp-version
        # Only needed when we'll authenticate (push to main / workflow_dispatch);
        # on pull_request we skip this + the tbot/ECR steps and only smoke-build.
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(curl -sf "https://${{ env.TELEPORT_FQDN }}/webapi/find" | jq -r '.auto_update.tools_version // .server_version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Teleport binaries
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/teleport
          key: teleport-${{ steps.tp-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Teleport
        if: github.event_name != 'pull_request'
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6  # v1.1.1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ env.TELEPORT_FQDN }}

      - name: ECR login via Teleport Workload Identity
        if: github.event_name != 'pull_request'
        run: |
          cat > /tmp/tbot.yaml << EOF_TBOT
          version: v2
          proxy_server: ${{ env.TELEPORT_FQDN }}
          onboarding:
            join_method: github
            token: ${{ env.TELEPORT_TOKEN }}
          oneshot: true
          storage:
            type: memory
          services:
            - type: workload-identity-jwt
              destination:
                type: directory
                path: /tmp/tbot-output
              selector:
                name: image-push
              audiences: ["sts.amazonaws.com"]
          EOF_TBOT

          mkdir -p /tmp/tbot-output

          # tbot's oneshot mode spawns a heartbeat service alongside the
          # workload-identity-jwt one. The heartbeat occasionally exits with
          # "service(heartbeat) error reading from server: EOF" — a transient
          # gRPC stream close on the Teleport side — even though the JWT was
          # written successfully. Treat the JWT file's presence as the source
          # of truth instead of tbot's exit code, then validate it actually
          # works against AWS STS before trusting it for ECR.
          set +e
          tbot start -c /tmp/tbot.yaml
          TBOT_RC=$?
          set -e
          if [ ! -s /tmp/tbot-output/jwt_svid ]; then
            echo "tbot exited $TBOT_RC and did not write a JWT — failing"
            exit 1
          fi
          if [ $TBOT_RC -ne 0 ]; then
            echo "tbot exited $TBOT_RC (non-zero, but JWT was written — most likely a transient heartbeat EOF; validating with STS next)"
          fi

          export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/tbot-output/jwt_svid
          export AWS_ROLE_ARN="${{ env.AWS_ROLE_ARN }}"
          export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}

          # Smoke-validate the JWT actually maps to the expected IAM role.
          aws sts get-caller-identity > /dev/null

          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login ${{ env.ECR_REGISTRY }} --username AWS --password-stdin

          # Release tags are immutable: a different image pushed under an existing
          # tag is rejected (TAG_INVALID), the identical one still succeeds. On
          # 2026-10-09 a re-minted release number silently overwrote released images.
          # `latest` moves on every release, so it is excluded.
          aws ecr describe-repositories --repository-names ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository --repository-name ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} \
            --image-tag-mutability IMMUTABLE_WITH_EXCLUSION \
            --image-tag-mutability-exclusion-filters filterType=WILDCARD,filter=latest

      - name: Generate release number
        id: release-number
        if: github.event_name != 'pull_request'
        # Pinned to a specific commit on mindbox-moscow/gha-release-number's
        # `master` branch. The action's repo doesn't tag releases; this SHA
        # is the source-of-truth we trust.
        uses: mindbox-moscow/gha-release-number@2e59ef5cea3cfc6df48854ec5718bfb520aa1337 # v1.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract upstream trow version
        id: trow-version
        run: |
          V=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # BuildKit (and the Rust checks' `docker run`) pull the base images through nora (packages.maestra.io, issues-maestra#1649)
      # with ~/.docker/config.json. nora takes the GitHub OIDC token, which lives minutes: a
      # credential helper mints a fresh one per pull. Same step as dotnet-service-build.yml in
      # maestra-io/github-actions.
      - name: nora docker credentials
        env:
          AUDIENCE: packages.maestra.io
          PACKAGES_URL: https://packages.maestra.io
        run: |
          # >>> nora-cred-helper (copy of maestra-io/github-actions dotnet-service-build.yml)
          bin="$RUNNER_TEMP/nora-bin"; mkdir -p "$bin"
          # The helper runs in the caller's environment, which tox and other test runners
          # scrub: the job's OIDC request URL and token go to a 0600 file next to it.
          ( umask 077; printf 'url=%q\ntoken=%q\naud=%q\n' "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$AUDIENCE" > "$bin/oidc.env" )
          cat > "$bin/docker-credential-nora" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          [ "${1:-}" = get ] || exit 0
          server=$(cat) # docker sends it without a newline
          . "${BASH_SOURCE[0]%/*}/oidc.env"
          t=$(curl -sSf --retry 3 --connect-timeout 10 --max-time 30 -H "Authorization: bearer $token" \
            "$url&audience=$aud" | jq -r '.value // empty')
          [ -n "$t" ]
          jq -cn --arg s "$server" --arg t "$t" '{ServerURL: $s, Username: "token", Secret: $t}'
          EOF
          chmod 755 "$bin/docker-credential-nora"
          echo "$bin" >> "$GITHUB_PATH"
          host="${PACKAGES_URL#*://}"; host="${host%%/*}"
          cfg="${DOCKER_CONFIG:-$HOME/.docker}/config.json"; mkdir -p "$(dirname "$cfg")"
          [ -s "$cfg" ] || echo '{}' > "$cfg"
          jq --arg h "$host" '.credHelpers[$h] = "nora"' "$cfg" > "$cfg.t" && mv "$cfg.t" "$cfg"
          # <<< nora-cred-helper

      # Crates through nora: a fresh token for docker/rust-checks.sh, which
      # downloads everything first and tests offline (fork PR: crates.io).
      - name: nora token for the Rust checks
        id: nora-checks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const t = await core.getIDToken('packages.maestra.io');
            core.setSecret(t);
            core.setOutput('token', t);

      - name: Rust checks (PR only)
        if: github.event_name == 'pull_request'
        env:
          NORA_TOKEN: ${{ steps.nora-checks.outputs.token }}
        # The build image carries the toolchain but not rustfmt/clippy, and the
        # tests need the sqlx dev database (migrations under migrations/). Run the
        # same checks CI would so a PR cannot merge a fork patch that breaks the
        # streaming tests.
        run: >-
          docker run --rm -v "$PWD":/w -w /w -e NORA_TOKEN
          packages.maestra.io/docker-hub/library/rust:1.94-trixie@sha256:652612f07bfbbdfa3af34761c1e435094c00dde4a98036132fca28c7bb2b165c bash docker/rust-checks.sh

      # docker-container driver: BuildKit pushes straight from its own store and
      # uploads only the layers ECR does not already have; `docker push` from a
      # fresh daemon re-uploaded every layer of every release.
      - uses: maestra-io/github-actions/setup-buildx@695d3e1cf135034b04c21640c13273f24867f24b # v1.85.0

      # ISO week for BASE_REFRESH: re-runs the `apt-get install` layers weekly
      # so the layer cache does not freeze them without security updates.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Crates through nora (packages.maestra.io): 3-day hold on new versions,
      # issues-maestra#1649. A fresh OIDC token (minutes-lived) right before the
      # image build, used by Dockerfile `fetch` and both apt stages. A fork PR gets
      # none: cargo falls back to crates.io (CARGO_SOURCE below), apt fails the build.
      - name: nora token for the image build
        id: nora-image
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const t = await core.getIDToken('packages.maestra.io');
            core.setSecret(t);
            core.setOutput('token', t);


      # Layer cache (type=gha, scope shared with the release build below).
      # build-push-action, not a raw `docker buildx build`: only the action
      # hands BuildKit the Actions cache URL/token; without them buildx drops
      # the gha cache entries silently. ignore-error: a cache export failure
      # must not fail a build that already succeeded.
      - name: Smoke build (PR only — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          provenance: false
          build-args: |
            BASE_REFRESH=${{ steps.week.outputs.week }}
            CARGO_SOURCE=${{ steps.nora-image.outputs.token && 'nora' || 'crates-io' }}
          secrets: PRIVATE_PACKAGES_TOKEN=${{ steps.nora-image.outputs.token }}
          cache-from: type=gha,scope=trow
          cache-to: type=gha,mode=max,scope=trow,ignore-error=true
          tags: trow:pr-${{ github.event.pull_request.number }}

      # Build once, push three tags of one digest.
      # `<upstream-version>-maestra.<release>` is the tag FluxCD pins, so a
      # fork patch is always visible in the tag itself.
      - name: Build and push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          labels: |
            org.opencontainers.image.created=${{ steps.trow-version.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=trow
            org.opencontainers.image.vendor=maestra-io
          provenance: false
          push: true
          cache-from: type=gha,scope=trow
          cache-to: type=gha,mode=max,scope=trow,ignore-error=true
          build-args: |
            BASE_REFRESH=${{ steps.week.outputs.week }}
            CARGO_SOURCE=${{ steps.nora-image.outputs.token && 'nora' || 'crates-io' }}
          secrets: PRIVATE_PACKAGES_TOKEN=${{ steps.nora-image.outputs.token }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release-number.outputs.release-number }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.trow-version.outputs.version }}-maestra.${{ steps.release-number.outputs.release-number }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # Re-mint the tbot JWT: a cold-cache Rust build can outlive the one from
      # the ECR login step. Best-effort, like the signing itself.
      - name: Refresh workload identity JWT
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: tbot start -c /tmp/tbot.yaml

      # The ECR login step's AWS exports die with it; the tbot JWT file stays.
      - name: Sign image + attest SBOM
        if: github.event_name != 'pull_request'
        uses: maestra-io/github-actions/sign-image@bdfea43a7d47149012fa1a488c91e5d6a49b2744 # v1.62.2
        env:
          AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/tbot-output/jwt_svid
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        with:
          image: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.push.outputs.digest }}

      - name: Create GitHub release
        if: github.event_name != 'pull_request'
        uses: maestra-io/github-actions/create-github-release@df704636a89df5ddddc1ba836f8b09c796456ed7 # v1.49.0
        with:
          release-number: ${{ steps.release-number.outputs.release-number }}
